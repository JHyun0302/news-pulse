services:
  frontend:
    image: ${FRONTEND_IMAGE:-news-pulse-frontend:latest}
    container_name: news-pulse-frontend
    restart: unless-stopped
    environment:
      BACKEND_HOST: ${BACKEND_HOST:?set BACKEND_HOST to the back-vm private IP or DNS name}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
    ports:
      - "${FRONT_BIND_ADDRESS:?set FRONT_BIND_ADDRESS to the front-vm private IP}:${FRONT_HOST_PORT:-80}:80"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /etc/nginx/conf.d
      - /var/run
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
