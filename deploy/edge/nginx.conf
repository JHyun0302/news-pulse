upstream news_pulse_front {
    # Replace front-vm with the front-vm private DNS name, or add it to /etc/hosts.
    server front-vm:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    access_log /var/log/nginx/news-pulse-access.log;
    error_log /var/log/nginx/news-pulse-error.log warn;

    # Operational admin calls should stay behind SSH/VPN/internal access.
    location ^~ /api/admin/ {
        return 404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://news_pulse_front;
    }
}
