services:
  backend:
    build:
      context: .
      dockerfile: new-pulse-backend/Dockerfile
    image: news-pulse-backend:local
    container_name: news-pulse-backend-local
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: local
      NEWS_PULSE_DB_PATH: /app/data/news-pulse.sqlite
      NEWS_PULSE_RSS_SCHEDULER_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - news-pulse-sqlite:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: new-pulse-frontend/Dockerfile
    image: news-pulse-frontend:local
    container_name: news-pulse-frontend-local
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  news-pulse-sqlite:
