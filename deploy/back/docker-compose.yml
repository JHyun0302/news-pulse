services:
  backend:
    image: ${BACKEND_IMAGE:-news-pulse-backend:latest}
    container_name: news-pulse-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      NEWS_PULSE_DB_PATH: ${NEWS_PULSE_DB_PATH:-/app/data/news-pulse.sqlite}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    ports:
      - "${BACKEND_BIND_ADDRESS:?set BACKEND_BIND_ADDRESS to the back-vm private IP}:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - ${NEWS_PULSE_DATA_DIR:-/opt/news-pulse/data}:/app/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
